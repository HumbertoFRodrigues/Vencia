<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--cobalt-500);display:flex;align-items:center;justify-content:center;padding:0 48px}
.main span{color:#fff;font-family:var(--font-sans);font-weight:600;font-size:92px;letter-spacing:-.035em;line-height:1.02;text-align:center}
.strip{width:320px;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><img src="assets/logo.png" alt="" style="max-width:78%;max-height:78%;object-fit:contain"></div>
<div class="strip"><div style="background:var(--amber-600)"></div><div style="background:var(--green-600)"></div><div style="background:var(--red-600)"></div><div style="background:var(--ink-900)"></div></div></body></html>
