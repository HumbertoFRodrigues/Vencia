<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Near-flat cards; real shadow only for overlays" -->
<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(20,23,29,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}body{background:var(--surface-app)}</style></head><body><div class="grid" style="gap:18px;padding:6px"><div class="sw" style="width:140px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span class="nm">controls</span><span class="mono">shadow-sm</span></div><div class="sw" style="width:140px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div><span class="nm">cards</span><span class="mono">shadow-card</span></div><div class="sw" style="width:140px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised)"></div><span class="nm">hover</span><span class="mono">shadow-raised</span></div><div class="sw" style="width:140px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay)"></div><span class="nm">modals</span><span class="mono">shadow-overlay</span></div></div></body></html>
