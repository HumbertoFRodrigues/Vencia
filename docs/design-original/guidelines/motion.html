<!-- @dsCard group="Brand" viewport="700x150" name="Motion & states" subtitle="140ms controls, 200ms surfaces; hover tints, no scale or bounce" -->
<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(20,23,29,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px 24px;width:100%;font-size:12px"><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">--dur-fast</span><span style="color:var(--text-muted)">140ms — hover, focus, checked</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">--dur-base</span><span style="color:var(--text-muted)">200ms — card shadow, panels</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">--dur-slow</span><span style="color:var(--text-muted)">320ms — dialog entry</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">--ease-standard</span><span style="color:var(--text-muted)">cubic-bezier(.2,.6,.25,1)</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">hover</span><span style="color:var(--text-muted)">background tint one step darker</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">press</span><span style="color:var(--text-muted)">next tint step, never a transform</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">focus</span><span style="color:var(--text-muted)">3px cobalt ring at 22% alpha</span></div><div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px"><span class="mono" style="color:var(--text-strong)">disabled</span><span style="color:var(--text-muted)">opacity .45, no colour change</span></div></div></body></html>
