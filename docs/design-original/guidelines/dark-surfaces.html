<!-- @dsCard group="Colors" viewport="700x160" name="Dark — surfaces & text" subtitle="data-theme=&quot;dark&quot; re-points the semantic aliases only" -->
<!DOCTYPE html><html lang="pt" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-app);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}</style></head><body><div class="grid"><div class="sw" style="width:78px"><div class="chip" style="background:var(--surface-app)"></div><span class="nm">surface-app</span><span class="mono">surface-app</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--surface-card)"></div><span class="nm">surface-card</span><span class="mono">surface-card</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--surface-sunken)"></div><span class="nm">surface-sunken</span><span class="mono">surface-sunken</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--surface-hover)"></div><span class="nm">surface-hover</span><span class="mono">surface-hover</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--border-subtle)"></div><span class="nm">border-subtle</span><span class="mono">border-subtle</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--border-default)"></div><span class="nm">border-default</span><span class="mono">border-default</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--text-body)"></div><span class="nm">text-body</span><span class="mono">text-body</span></div><div class="sw" style="width:78px"><div class="chip" style="background:var(--text-strong)"></div><span class="nm">text-strong</span><span class="mono">text-strong</span></div></div></body></html>
