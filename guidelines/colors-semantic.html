<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="Always author against these, never the raw ramps" -->
<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(20,23,29,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;width:100%;font-size:12px"><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--surface-app);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--surface-app</span><span style="color:var(--text-muted)">app background</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--surface-card);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--surface-card</span><span style="color:var(--text-muted)">cards, top bar</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--surface-sunken);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--surface-sunken</span><span style="color:var(--text-muted)">search, table head</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--text-strong);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--text-strong</span><span style="color:var(--text-muted)">headings, values</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--text-body);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--text-body</span><span style="color:var(--text-muted)">body copy</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--text-muted);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--text-muted</span><span style="color:var(--text-muted)">labels, meta</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--border-subtle);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--border-subtle</span><span style="color:var(--text-muted)">card + row rules</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--border-default);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--border-default</span><span style="color:var(--text-muted)">control borders</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-subtle);background:var(--accent);flex:0 0 auto"></span><span class="mono" style="color:var(--text-strong)">--accent</span><span style="color:var(--text-muted)">primary action</span></div></div></body></html>
