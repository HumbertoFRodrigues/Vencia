<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(20,23,29,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}</style></head><body><div class="grid"><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-0)"></div><span class="nm">Ink 0</span><span class="mono">ink-0</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-50)"></div><span class="nm">Ink 50</span><span class="mono">ink-50</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-100)"></div><span class="nm">Ink 100</span><span class="mono">ink-100</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-200)"></div><span class="nm">Ink 200</span><span class="mono">ink-200</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-300)"></div><span class="nm">Ink 300</span><span class="mono">ink-300</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-500)"></div><span class="nm">Ink 500</span><span class="mono">ink-500</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-700)"></div><span class="nm">Ink 700</span><span class="mono">ink-700</span></div><div class="sw" style="width:76px"><div class="chip" style="background:var(--ink-900)"></div><span class="nm">Ink 900</span><span class="mono">ink-900</span></div></div></body></html>
