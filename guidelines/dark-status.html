<!-- @dsCard group="Colors" viewport="700x170" name="Dark — status & accent" subtitle="Same five states, re-tuned for the dark surface" -->
<!DOCTYPE html><html lang="pt" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-app);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}</style></head><body><div style="display:flex;flex-direction:column;gap:14px;width:100%">
<div class="grid" style="gap:12px"><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-active-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-active-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-active-dot)"></span>Activo</div></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-due-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-due-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-due-dot)"></span>A vencer</div></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-overdue-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-overdue-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-overdue-dot)"></span>Vencido</div></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-suspended-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-suspended-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-suspended-dot)"></span>Suspenso</div></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-cancelled-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-cancelled-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-cancelled-dot)"></span>Cancelado</div></div></div>
<div style="display:flex;align-items:center;gap:12px">
<span style="display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:500">Renovar</span>
<span style="display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:var(--radius-sm);background:var(--surface-card);border:1px solid var(--border-default);color:var(--text-strong);font-size:13px;font-weight:500">Registrar pagamento</span>
<span class="num" style="font-size:21px;font-weight:600;color:var(--text-strong)">12.500 <span style="font-size:.6em;color:var(--text-muted)">MZN</span></span>
</div></div></body></html>
