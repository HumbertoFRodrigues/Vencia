<!-- @dsCard group="Colors" viewport="700x160" name="Status colours" subtitle="Activo / A vencer / Vencido / Suspenso / Cancelado" -->
<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:16px;display:flex;align-items:center}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(20,23,29,.06)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;color:var(--text-strong);font-weight:500}.grid{display:flex;gap:10px;flex-wrap:wrap;width:100%}</style></head><body><div class="grid" style="gap:12px"><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-active-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-active-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-active-dot)"></span>Activo</div><span class="mono">active</span></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-due-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-due-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-due-dot)"></span>A vencer</div><span class="mono">due</span></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-overdue-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-overdue-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-overdue-dot)"></span>Vencido</div><span class="mono">overdue</span></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-suspended-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-suspended-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-suspended-dot)"></span>Suspenso</div><span class="mono">suspended</span></div><div class="sw" style="width:124px"><div class="chip" style="background:var(--status-cancelled-bg);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--status-cancelled-fg);font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-cancelled-dot)"></span>Cancelado</div><span class="mono">cancelled</span></div></div></body></html>
