<!-- @dsCard group="Brand" viewport="700x150" name="Payment methods" subtitle="M-Pesa and e-Mola use the supplied logo files; transfer and cash use icon tiles" -->
<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:16px;display:flex;align-items:center}.m{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-body)}.t{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-xs);overflow:hidden;box-shadow:0 0 0 1px rgba(20,23,29,.07)}.ic{width:17px;height:17px;background:var(--text-body)}</style></head>
<body><div style="display:flex;gap:22px;flex-wrap:wrap;width:100%">
<span class="m"><span class="t"><img src="../assets/logos/mpesa.png" alt="M-Pesa" style="width:100%;height:100%;object-fit:cover"></span>M-Pesa</span>
<span class="m"><span class="t"><img src="../assets/logos/emola.png" alt="e-Mola" style="width:100%;height:100%;object-fit:cover"></span>e-Mola</span>
<span class="m"><span class="t" style="background:var(--surface-sunken)"><span class="ic" style="-webkit-mask:url('https://unpkg.com/lucide-static@0.454.0/icons/landmark.svg') center/contain no-repeat;mask:url('https://unpkg.com/lucide-static@0.454.0/icons/landmark.svg') center/contain no-repeat"></span></span>Transferência</span>
<span class="m"><span class="t" style="background:var(--status-active-bg)"><span class="ic" style="background:var(--status-active-fg);-webkit-mask:url('https://unpkg.com/lucide-static@0.454.0/icons/banknote.svg') center/contain no-repeat;mask:url('https://unpkg.com/lucide-static@0.454.0/icons/banknote.svg') center/contain no-repeat"></span></span>Dinheiro</span>
<span class="m"><span class="t" style="background:var(--surface-sunken)"><span class="ic" style="-webkit-mask:url('https://unpkg.com/lucide-static@0.454.0/icons/credit-card.svg') center/contain no-repeat;mask:url('https://unpkg.com/lucide-static@0.454.0/icons/credit-card.svg') center/contain no-repeat"></span></span>Outro</span>
</div></body></html>
